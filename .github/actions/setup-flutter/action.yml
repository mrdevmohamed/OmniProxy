# Shared Flutter SDK setup for OmniProxy (owned by the CI Architect).
#
# Used by the Flutter CI and release workflows. Pins the stable Flutter SDK
# version and enables the pub cache. Callers are expected to have already run
# actions/checkout; this action does not check out the repository.

name: Setup Flutter SDK

description: >-
  Install a pinned stable Flutter SDK and cache the Dart/Flutter pub cache.

inputs:
  flutter-version:
    description: Exact Flutter SDK version to install.
    required: false
    default: '3.44.6'
  channel:
    description: Flutter release channel (stable for release builds).
    required: false
    default: stable
  cache:
    description: Enable caching of the Flutter/Dart pub cache.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # subosito/flutter-action@v2.23.0
      with:
        flutter-version: ${{ inputs.flutter-version }}
        channel: ${{ inputs.channel }}
        cache: ${{ inputs.cache }}

    # Log the exact SDK so later failures can be correlated with the toolchain
    # that produced them (the runner images change over time).
    - name: Verify Flutter toolchain
      shell: bash
      run: flutter --version
