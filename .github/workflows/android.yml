name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Builds the Android release on a Linux host: gomobile binds the Go core into
# `omniproxy.aar` (with_gvisor tag), then `flutter build apk --release
# --split-per-abi` produces one small APK per CPU architecture (arm64-v8a,
# armeabi-v7a, x86_64) instead of a single fat APK. Mirrors `make
# stage-android`. On v* tags the per-ABI APKs are attached to the GitHub
# Release so users can download the one matching their device; otherwise they
# are kept as CI artifacts only.

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # gomobile bind needs an Android NDK; the GitHub ubuntu-latest image ships
      # the Android SDK (cmdline-tools) but not the NDK itself.
      - name: Install Android NDK
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;28.2.13676358" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      # Pins gomobile to the x/mobile version in core/go.mod; init builds the
      # gobind helper gomobile bind needs.
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile
          gomobile init
        working-directory: core

      - name: Build APKs (gomobile AAR + flutter split-per-abi) and stage
        run: make stage-android

      - name: Upload per-ABI APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omniproxy-android
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
