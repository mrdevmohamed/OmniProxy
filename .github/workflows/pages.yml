name: Docs site (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs/requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

# Two-job pattern: `build` compiles the docs into static HTML and uploads it
# as the Pages artifact; `deploy` publishes that artifact to GitHub Pages.
# Deploy must run under the `github-pages` environment (the Pages environment)
# and authenticates with GitHub via OIDC (id-token: write), so no PAT or
# deployment token is required.
#
# REQUIRED Pages source setting: this workflow only runs when the repository's
# Pages source is configured to "GitHub Actions"
# (Settings > Pages > Build and deployment > Source: GitHub Actions).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # actions/configure-pages@v6.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      # --strict fails the build on broken links and MkDocs warnings. The
      # docs use `docs/FILE.md:123` style cross-references as plain text;
      # MkDocs does not auto-link bare text, so these are safe. If --strict
      # ever proves too strict, drop the flag here.
      - name: Build docs
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # actions/deploy-pages@v5.0.0
